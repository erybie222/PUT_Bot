items:
  # --- thresholds -----------------------------------------------------------
  - id: prog-poprawny
    what_it_tests: "Kontrola: poprawna, pełna odpowiedź z uprzejmością i źródłem."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Proszę bardzo — próg na Informatykę w 2025 roku wyniósł 759,00 pkt, limit przyjęć: 210 miejsc.\n\nŹródło: PDF: data/progi punktowe 2025-2021.pdf (dane z 2026-10-30)"
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: {min_points: 759.00, capacity: 210}
    expected_faithfulness: 2
    expected_correctness: 2

  - id: prog-zmyslona-liczba
    what_it_tests: "Liczba punktów inna niż w danych (795 zamiast 759)."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Próg na Informatykę w 2025 roku wyniósł 795,00 pkt, limit przyjęć: 210 miejsc."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: {min_points: 759.00, capacity: 210}
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-zly-limit
    what_it_tests: "Dobry próg, zły limit przyjęć (180 zamiast 210)."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Próg wyniósł 759 pkt, a limit przyjęć to 180 miejsc."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: {min_points: 759.00, capacity: 210}
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-brak-limitu
    what_it_tests: "Odpowiedź prawdziwa, ale bez limitu przyjęć — niepełna, nie zmyślona."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Próg na Informatykę w 2025 roku wyniósł 759 punktów."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: {min_points: 759.00, capacity: 210}
    expected_faithfulness: 2
    expected_correctness: 1

  - id: prog-odmowa-mimo-danych
    what_it_tests: "Narzędzie zwróciło próg, a odpowiedź mówi, że danych nie ma."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Niestety nie mam danych o progu na Informatykę za 2025 rok."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: {min_points: 759.00, capacity: 210}
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-szacunek-przy-pustym-wyniku
    what_it_tests: "Pusty wynik, a odpowiedź podaje szacunek „około 750 pkt”."
    question: "Jaki był próg na Cyberbezpieczeństwo w 2022 roku?"
    tool_calls: *threshold_cyber_2022_empty
    answer: "Nie mam dokładnej liczby, ale próg wynosił zapewne około 750 pkt, podobnie jak w kolejnych latach."
    expected_answer: "Nie wiem — nie ma danych o progu na Cyberbezpieczeństwo za 2022 rok w źródle."
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-uczciwa-odmowa-przy-pustym-wyniku
    what_it_tests: "Kontrola: pusty wynik i uczciwe „nie wiem” z propozycją pomocy."
    question: "Jaki był próg na Cyberbezpieczeństwo w 2022 roku?"
    tool_calls: *threshold_cyber_2022_empty
    answer: "Niestety nie mam danych o progu na Cyberbezpieczeństwo za 2022 rok. Chętnie sprawdzę inny rok."
    expected_answer: "Nie wiem — nie ma danych o progu na Cyberbezpieczeństwo za 2022 rok w źródle."
    expected_faithfulness: 2
    expected_correctness: 2

  # --- office hours ---------------------------------------------------------
  - id: konsultacje-poprawne-inne-formy
    what_it_tests: "Kontrola: poprawne dane w innych formach zapisu (12.30-14.00, odmiana nazwiska, mała litera w sali)."
