  - id: konsultacje-niepoparta-rada
    what_it_tests: "Poprawne dane plus ogólna rada spoza danych — rubryka daje za nią 1, nie 0."
    question: "Kiedy konsultacje ma dr hab. Marek Wojciechowski?"
    tool_calls: *office_hours_marek
    answer: "We wtorek 12:30–14:00, sala A1 503; prosi o wcześniejszy kontakt mailowy, możliwe też spotkanie online. Warto przyjść kilka minut wcześniej, bo zwykle tworzy się kolejka."
