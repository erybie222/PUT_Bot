# Judge calibration: answers whose right score is known in advance, used by
# eval/calibrate_judges.py to check that the two judges score them that way.
#
# Why: the faithfulness judge's share of zeros is the project's headline
# hallucination number. A judge that never gives 0 is either looking at a
# faithful bot or blind to what it should catch — and the benchmark alone
# cannot tell the two apart, because the bot's answers there are mostly fine.
# Here most answers are broken on purpose (an invented number, a swapped hour,
# a value from another row), each paired with correct answers that must NOT
# be punished (surface forms, courtesy, honest refusals).
#
# Each item:
#   id                     unique name, e.g. for `--only <id>`
#   what_it_tests          what is broken (or deliberately fine) in the answer
#   question               the user's question
#   earlier_turns          optional: [{question, answer}] before it, as in a
#                          multi-turn benchmark case
#   tool_calls             what the tools returned: [{name, args, result}];
#                          [] when nothing was called. Copied from the real
#                          database (2026-10-31), so the judge sees real rows —
#                          and fixed here, so a re-ingestion changes nothing.
#   answer                 the answer the judges score — written by hand
#   expected_faithfulness  0/1/2 the faithfulness judge should give, or absent
#   expected_correctness   0/1/2 the correctness judge should give, or absent;
#                          then the reference fields below are needed, exactly
#                          as in benchmark.yaml:
#   expected_answer, expected_data, expected_behavior
#
# Only items with an unambiguous score belong here: a borderline item measures
# the writer's taste, not the judge. Edit by hand (anchors below).

