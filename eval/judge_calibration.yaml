    expected_behavior: "Bot NIE wybiera jednej osoby — są dwie o identycznym imieniu i nazwisku (Zakład Systemów Informatycznych oraz Zakład Teorii Algorytmów i Systemów Programowania). Musi dopytać, o którą chodzi."
    expected_faithfulness: 2
    expected_correctness: 2

