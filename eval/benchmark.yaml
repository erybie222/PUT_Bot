# Benchmark: questions with verified answers, used by eval/run_eval.py to
# measure how well the agent answers.
#
# Every expected value below was checked by hand against the case's `source`
# (the project's rule is that no number may be made up — that applies to this
# file too). Cases are written in Polish, like real users' questions; the
# `pytania_po_angielsku` category holds the English ones.
#
# Each top-level list is a category; each item in it is one case:
#
#   id                 unique name, e.g. for `--only <id>`
#   question           what the agent is asked
#   expected_answer    the correct answer in words; the correctness judge
#                      compares the agent's answer with it. Only what the
#                      question asks, plus the fields SYSTEM_PROMPT says
#                      always belong in an answer (a threshold's capacity, a
#                      course's ECTS and assessment_type, an office hour's
#                      location and comment). Anything more marks a complete
#                      answer as incomplete.
#   expected_data      the key facts the answer must contain (null when the
#                      right answer is "there is no such data")
#   expected_behavior  instead of an answer: what the agent should do, e.g.
#                      ask which of two people is meant
#   expected_calls     the tool calls a correct answer needs (see below);
#                      [] means the agent should call no tool at all
#   source             where the expected values were verified
#   entities, edge_case, notes
#                      for people reading this file only — the evaluation
#                      ignores them
#
# Rules for expected_calls:
#   - List only the calls a correct answer *requires*. Extra calls by the
#     agent are tolerated (they are only counted), but a listed call the agent
#     did not need would fail an agent that found a different valid route.
#   - Arguments are not compared as text. The listed calls are run on the
#     database and their results compared with the agent's, so "informatyka"
#     and "Informatyka" are equally right.
#   - "$prev.id" stands for the id returned by the previous listed call (e.g.
#     get_staff, then get_office_hour for that person). Staff ids change on
#     every ingestion, so real ids cannot be written here.
#
# Edit this file by hand only: loading and re-saving it with a YAML library
# would delete every comment and the &anchors / *references below.

meta:
  last_verified: "2026-10-25"
  sources:
    progi: &progi "data/progi punktowe 2025-2021.pdf"
    przedmioty: &przedmioty "https://put.poznan.pl/karty-ects/2026_2027/Informatyka/stacjonarne/studia%20pierwszego%20stopnia"
    przedmioty_cyber: &przedmioty_cyber "https://put.poznan.pl/karty-ects/2026_2027/Cyberbezpieczeństwo/stacjonarne/studia%20pierwszego%20stopnia"
    kierunki: &kierunki "src/run_ingestion.py"
    informator: &informator "informator.put.poznan.pl API"

# ---------------------------------------------------------------------------
# Category 1 — progi_punktowe (admission thresholds)
# ---------------------------------------------------------------------------
progi_punktowe:
  - id: prog-informatyka-2025
    question: "Jaki był próg punktowy na Informatykę (stacjonarne, I stopnia) w roku 2025?"
    entities: {kierunek: "Informatyka", rok: 2025, tryb: "stacjonarne", stopien: "pierwszego stopnia"}
    expected_data: {min_points: 759.00, capacity: 210}
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    source: *progi
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Informatyka", year: 2025}

  - id: prog-bioinformatyka-2021
    question: "Jaki był próg na Bioinformatykę w 2021 roku?"
    entities: {kierunek: "Bioinformatyka", rok: 2021}
    expected_data: {min_points: 525.50, capacity: 60}
    expected_answer: "525,50 pkt, limit przyjęć: 60 miejsc."
    notes: "Limit przyjęć zmieniał się między latami (70 w 2022, 60 w 2021) — dobry test, że bot nie zakłada stałego limitu."
    source: *progi
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Bioinformatyka", year: 2021}

  - id: prog-cyberbezpieczenstwo-2025
    question: "Jaki był próg na Cyberbezpieczeństwo w 2025 roku?"
    entities: {kierunek: "Cyberbezpieczeństwo", rok: 2025}
    expected_data: {min_points: 807.50, capacity: 90}
    expected_answer: "807,50 pkt, limit przyjęć: 90 miejsc."
    notes: "Nowy kierunek — 2025 to jedyny rok z danymi w źródle."
    source: *progi
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Cyberbezpieczeństwo", year: 2025}

  - id: prog-edge-cyberbezpieczenstwo-brak-danych
    question: "Jaki był próg na Cyberbezpieczeństwo w 2022 roku?"
    entities: {kierunek: "Cyberbezpieczeństwo", rok: 2022}
    expected_data: null
    expected_answer: "Nie wiem — nie ma danych o progu na Cyberbezpieczeństwo za 2022 rok w źródle."
    edge_case: "rok bez danych (kierunek za młody), nie wolno ekstrapolować"
    source: *progi
    # expected_calls note: Must query and get nothing back — refusing without checking is the failure this catches.
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Cyberbezpieczeństwo", year: 2022}

  - id: prog-edge-kierunek-poza-zakresem
    question: "Jaki był próg na Automatykę i robotykę w 2025 roku?"
    entities: {kierunek: "Automatyka i robotyka", rok: 2025}
    expected_data: null
    expected_answer: "Nie wiem — Automatyka i robotyka nie jest kierunkiem WIiT obsługiwanym przez ten projekt. Odpowiedź musi powiedzieć, że takiego kierunku nie ma w bazie; samo „nie ma progu za 2025” jest niepełne, bo sugeruje, że kierunek istnieje i mógłby mieć próg w innym roku."
    edge_case: "kierunek istnieje w źródle PDF, ale poza zakresem WIiT tego projektu"
    source: *progi
    # expected_calls note: The question asks for a threshold, so that lookup comes first. When it
    #   comes back empty, SYSTEM_PROMPT prescribes the get_major listing rather than a lookup by
    #   name: an empty name lookup only says this spelling is not stored, while the listing shows
    #   whether the major exists at all — the difference between "no such major" and "no data
    #   for 2025" that this case is about.
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Automatyka i robotyka", year: 2025}
      - tool: get_major
        args: {}

  - id: prog-edge-rok-w-przyszlosci
    question: "Jaki będzie próg na Informatykę w 2030 roku?"
    entities: {kierunek: "Informatyka", rok: 2030}
    expected_data: null
    expected_answer: "Nie wiem — progi na przyszłe lata nie są znane, tylko historyczne dane z rekrutacji."
    edge_case: "rok spoza zakresu danych źródłowych"
    source: *progi
    # expected_calls review: Debatable — declining a future year is defensible reasoning, not invention. Listed
    #   anyway because thresholds are stored per year, so the database can answer it.
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Informatyka", year: 2030}

  - id: prog-edge-tryb-niestacjonarny
    question: "Jaki był próg na Informatykę niestacjonarną w 2024 roku?"
    entities: {kierunek: "Informatyka", rok: 2024, tryb: "niestacjonarne"}
    expected_data: null
    expected_answer: "Nie wiem — projekt zbiera dziś tylko studia stacjonarne pierwszego stopnia."
    edge_case: "tryb studiów spoza obecnego zakresu ingestii"
    source: *progi
    expected_calls:
      - tool: get_admission_threshold
        args: {major_name: "Informatyka", year: 2024, study_mode: "part-time"}

# ---------------------------------------------------------------------------
# Category 2 — plany_studiow (study plans / ECTS courses)
# ---------------------------------------------------------------------------
plany_studiow:
  - id: przedmiot-alin-semestr
    question: "W którym semestrze na Informatyce jest 'Algebra liniowa' i ile ma ECTS?"
    entities: {kierunek: "Informatyka", przedmiot: "Algebra liniowa"}
    expected_data: {semester: 1, ects: 2, is_obligatory: true, hours_lecture: 16, hours_classes: 16, assessment_type: "Zaliczenie z ocena"}
    expected_answer: "Semestr 1, 2 ECTS, zaliczenie na ocenę (bez egzaminu)."
    source: *przedmioty
    expected_calls:
      - tool: get_course
        args: {major_name: "Informatyka", course_name: "Algebra liniowa"}

  - id: przedmiot-anam-egzamin
    question: "Czy 'Analiza matematyczna' na Informatyce kończy się egzaminem i ile ma ECTS?"
    entities: {kierunek: "Informatyka", przedmiot: "Analiza matematyczna"}
    expected_data: {semester: 1, ects: 6, is_obligatory: true, hours_lecture: 30, hours_classes: 30, assessment_type: "Egzamin"}
    expected_answer: "Tak, egzamin. 6 ECTS."
    notes: "assessment_type w bazie to dosłownie string 'Egzamin' wykryty po markerze (E) w komórce godzin wykładowych."
    source: *przedmioty
    expected_calls:
      - tool: get_course
        args: {major_name: "Informatyka", course_name: "Analiza matematyczna"}

  - id: przedmiot-sop-semestr2
    question: "Ile ECTS ma 'Systemy operacyjne' na Informatyce i czy to egzamin?"
    entities: {kierunek: "Informatyka", przedmiot: "Systemy operacyjne"}
    expected_data: {semester: 2, ects: 5, is_obligatory: true, hours_lecture: 30, hours_lab: 30, assessment_type: "Egzamin"}
    expected_answer: "5 ECTS, egzamin."
    source: *przedmioty
    expected_calls:
      - tool: get_course
        args: {major_name: "Informatyka", course_name: "Systemy operacyjne"}

  - id: przedmiot-python-obieralny
    question: "Czy 'Podstawy programowania - Python' jest obowiązkowe na pierwszym semestrze Informatyki?"
    entities: {kierunek: "Informatyka", przedmiot: "Podstawy programowania - Python", semestr: 1}
    expected_data: {semester: 1, ects: 4, is_obligatory: false, hours_lecture: 24, hours_lab: 30}
    expected_answer: "Nie, to przedmiot obieralny (do wyboru), 4 ECTS."
    source: *przedmioty
    expected_calls:
      - tool: get_course
        args: {major_name: "Informatyka", course_name: "Python", semester: 1}

  - id: przedmiot-suma-ects-semestr1-obowiazkowe
    question: "Ile punktów ECTS łącznie mają obowiązkowe przedmioty w semestrze 1 na Informatyce?"
    entities: {kierunek: "Informatyka", semestr: 1, is_obligatory: true}
    expected_data:
      courses: {ALIN: 2, ANAM: 6, JANG: 2, LOG: 3, MATD: 6, NINF: 3, BHP: 0, BIBL: 0}
      total_ects: 22
    expected_answer: "22 ECTS (Algebra liniowa 2 + Analiza matematyczna 6 + Język angielski 2 + Logika obliczeniowa 3 + Matematyka dyskretna 6 + Narzędzia informatyki 3 + BHP 0 + Usługi biblioteczne 0)."
    notes: "Wymaga agregacji (SUM), nie samej listy wierszy — patrz CLAUDE.md backlog #11."
    source: *przedmioty
    expected_calls:
      - tool: get_course
        args: {major_name: "Informatyka", semester: 1, is_obligatory: true}

  - id: przedmiot-edge-nieistniejacy
    question: "Ile ECTS ma przedmiot 'Głębokie sieci neuronowe' na pierwszym semestrze Informatyki?"
    entities: {kierunek: "Informatyka", przedmiot: "Głębokie sieci neuronowe", semestr: 1}
    expected_data: null
    expected_answer: "Nie wiem — nie ma takiego przedmiotu w planie studiów Informatyki na semestrze 1."
    edge_case: "nieistniejący przedmiot — bot nie może zgadywać ani podstawiać podobnej nazwy"
    source: *przedmioty
    expected_calls:
      - tool: get_course
        args: {major_name: "Informatyka", course_name: "Głębokie sieci neuronowe", semester: 1}

  - id: przedmiot-wdp-cyberbezpieczenstwo-egzamin
    question: "Ile ECTS ma 'Wprowadzenie do programowania' na Cyberbezpieczeństwie i czy to egzamin?"
    entities: {kierunek: "Cyberbezpieczeństwo", przedmiot: "Wprowadzenie do programowania"}
    expected_data: {semester: 1, ects: 5, is_obligatory: true, hours_lecture: 30, hours_lab: 30, assessment_type: "Egzamin"}
    expected_answer: "5 ECTS, egzamin."
    source: *przedmioty_cyber
    expected_calls:
      - tool: get_course
        args: {major_name: "Cyberbezpieczeństwo", course_name: "Wprowadzenie do programowania"}

  - id: przedmiot-wdc-cyberbezpieczenstwo-projekt
    question: "Ile godzin projektu ma 'Wstęp do cyberbezpieczeństwa' i ile to ECTS?"
    entities: {kierunek: "Cyberbezpieczeństwo", przedmiot: "Wstęp do cyberbezpieczeństwa"}
    expected_data: {semester: 1, ects: 4, is_obligatory: true, hours_lecture: 30, hours_project: 30, assessment_type: "Zaliczenie z ocena"}
    expected_answer: "30h projektu, 4 ECTS, bez egzaminu (zaliczenie na ocenę)."
    notes: "Przykład kursu z niezerowymi hours_project — pozostałe przykłady w tym pliku mają P=0."
    source: *przedmioty_cyber
    expected_calls:
      - tool: get_course
        args: {major_name: "Cyberbezpieczeństwo", course_name: "Wstęp do cyberbezpieczeństwa"}

  - id: przedmiot-edge-ta-sama-nazwa-inny-kierunek
    question: "Ile ECTS ma 'Algebra liniowa' — na Cyberbezpieczeństwie i na Informatyce?"
    entities: {przedmiot: "Algebra liniowa", kierunki: ["Cyberbezpieczeństwo", "Informatyka"]}
    expected_data:
      Cyberbezpieczeństwo: {course_code: "S1Cybez1>ALIN", ects: 5, assessment_type: "Egzamin", hours_lecture: 30, hours_classes: 30}
      Informatyka: {course_code: "S1Inf1>ALIN", ects: 2, assessment_type: "Zaliczenie z ocena", hours_lecture: 16, hours_classes: 16}
    expected_answer: "To dwa różne przedmioty mimo tej samej nazwy: na Cyberbezpieczeństwie 5 ECTS z egzaminem, na Informatyce 2 ECTS bez egzaminu."
    edge_case: "ten sam `name`, różny `course_code` i różna treść w zależności od kierunku — test na to, że bot dopytuje/rozróżnia po kierunku, a nie dopasowuje tylko po nazwie przedmiotu"
    source: *przedmioty_cyber
    # expected_calls note: The answer needs both majors, so stopping at one call is a genuine miss.
    expected_calls:
      - tool: get_course
        args: {major_name: "Cyberbezpieczeństwo", course_name: "Algebra liniowa"}
      - tool: get_course
        args: {major_name: "Informatyka", course_name: "Algebra liniowa"}

# ---------------------------------------------------------------------------
# Category 3 — kierunki (majors)
# ---------------------------------------------------------------------------
kierunki:
  - id: kierunek-lista-wiit
    question: "Jakie kierunki I stopnia stacjonarne (obsługiwane przez tego bota) prowadzi WIiT?"
    expected_data:
      majors: ["Informatyka", "Bioinformatyka", "Teleinformatyka", "Cyberbezpieczeństwo", "Mikroelektronika i komunikacja cyfrowa", "Sztuczna inteligencja"]
    expected_answer: "Informatyka, Bioinformatyka, Teleinformatyka, Cyberbezpieczeństwo, Mikroelektronika i komunikacja cyfrowa, Sztuczna inteligencja."
    notes: "To lista tego, co faktycznie jest w WIIT_MAJORS_*, nie pełna oferta WIiT — dobry test, żeby bot nie 'dopowiadał' kierunków spoza swojego zakresu."
    source: *kierunki
    # expected_calls note: get_major with no arguments is the only way to enumerate majors.
    expected_calls:
      - tool: get_major
        args: {}

  - id: kierunek-ai-jezyk
    question: "Czy Sztuczna inteligencja jest kierunkiem anglojęzycznym?"
    entities: {kierunek: "Sztuczna inteligencja"}
    expected_data: {is_english: true, degree: "bachelor-of-engineering", study_mode: "full-time"}
    expected_answer: "Tak — Sztuczna inteligencja jest kierunkiem anglojęzycznym (is_english=true)."
    source: *kierunki
    expected_calls:
      - tool: get_major
        args: {major_name: "Sztuczna inteligencja"}

  - id: kierunek-tryb-teleinformatyka
    question: "Jaki tryb studiów jest ingestowany dla Teleinformatyki — stacjonarny czy niestacjonarny?"
    entities: {kierunek: "Teleinformatyka"}
    expected_data: {study_mode: "full-time"}
    expected_answer: "Stacjonarny (`full-time`)."
    source: *kierunki
    expected_calls:
      - tool: get_major
        args: {major_name: "Teleinformatyka"}

  - id: kierunek-edge-poza-zakresem
    question: "Czy WIiT prowadzi kierunek 'Informatyka i ekonometria'?"
    entities: {kierunek: "Informatyka i ekonometria"}
    expected_data: null
    expected_answer: "Nie wiem — taki kierunek nie jest w bazie tego projektu."
    edge_case: "nieistniejący/nieobsługiwany kierunek — bot nie może potwierdzić czegoś, czego nie ingestuje"
    source: *kierunki
    expected_calls:
      - tool: get_major
        args: {major_name: "Informatyka i ekonometria"}

# ---------------------------------------------------------------------------
# Category 4 — kadra_i_jednostki (staff, staff_functions, departments)
# ---------------------------------------------------------------------------
kadra_i_jednostki:
  - id: dept-zaklady-instytutu-informatyki
    question: "Jakie zakłady/jednostki wchodzą w skład Instytutu Informatyki?"
    entities: {jednostka: "Instytut Informatyki"}
    expected_data:
      children: ["Europejskie Centrum Bioinformatyki i Genomiki", "Zakład Badań Operacyjnych i Sztucznej Inteligencji", "Zakład Inteligentnych Systemów Wspomagania Decyzji", "Zakład Inżynierii Oprogramowania", "Zakład Systemów Informatycznych", "Zakład Technologii Przetwarzania Danych", "Zakład Teorii Algorytmów i Systemów Programowania", "Zakład Uczenia Maszynowego"]
    expected_answer: "7 zakładów (Badań Operacyjnych i SI, Inteligentnych Systemów Wspomagania Decyzji, Inżynierii Oprogramowania, Systemów Informatycznych, Technologii Przetwarzania Danych, Teorii Algorytmów i Systemów Programowania, Uczenia Maszynowego) + Europejskie Centrum Bioinformatyki i Genomiki."
    source: *informator
    expected_calls:
      - tool: get_department
        args: {name: "Instytut Informatyki"}

  - id: dept-jednostka-nadrzedna
    question: "Jaka jest jednostka nadrzędna (parent) dla Zakładu Uczenia Maszynowego?"
    entities: {jednostka: "Zakład Uczenia Maszynowego"}
    expected_data: {parent: "Instytut Informatyki"}
    expected_answer: "Instytut Informatyki."
    source: *informator
    expected_calls:
      - tool: get_department
        args: {name: "Zakład Uczenia Maszynowego"}

  # The next three cases were about Instytut Radiokomunikacji until 2026-10-25, when
  # Informator showed it restructured: it is now Zakład Radiokomunikacji under the new
  # Instytut Teleinformatyki, whose director is the former institute's director.
  - id: dept-parent-null-instytut
    question: "Czy Instytut Teleinformatyki ma jednostkę nadrzędną inną niż sam Wydział?"
    entities: {jednostka: "Instytut Teleinformatyki"}
    expected_data: {parent: null}
    expected_answer: "Nie — leży bezpośrednio pod WIiT."
    source: *informator
    expected_calls:
      - tool: get_department
        args: {name: "Instytut Teleinformatyki"}

  - id: dept-edge-brak-podjednostek
    question: "Jakie zakłady wchodzą w skład Instytutu Telekomunikacji Multimedialnej?"
    entities: {jednostka: "Instytut Telekomunikacji Multimedialnej"}
    expected_data: {children: []}
    expected_answer: "Żadne — według aktualnego drzewa organizacyjnego Informatora Instytut Telekomunikacji Multimedialnej nie ma podległych zakładów w WIiT."
    edge_case: "pusta lista podjednostek — nie mylić z brakiem danych"
    source: *informator
    expected_calls:
      - tool: get_department
        args: {name: "Instytut Telekomunikacji Multimedialnej"}

  - id: staff-dyrektor-instytutu
    question: "Kto jest dyrektorem Instytutu Teleinformatyki?"
    entities: {jednostka: "Instytut Teleinformatyki", funkcja: "Dyrektor instytutu"}
    expected_data: {first_name: "Hanna", last_name: "Bogucka", academic_title: "prof. dr hab. inż.", position: "Profesor", function_name: "Dyrektor instytutu"}
    expected_answer: "prof. dr hab. inż. Hanna Bogucka."
    notes: "staff_functions ('Dyrektor instytutu') jest odrębne od staff.position ('Profesor') — dobry test, że bot nie miesza tych dwóch pól."
    source: *informator
    expected_calls:
      - tool: get_staff_function
        args: {function_name: "Dyrektor instytutu", department_name: "Instytut Teleinformatyki"}

  - id: staff-administracyjny-dziekanat
    question: "Jakie stanowisko ma mgr Beata Banaszak i w jakiej jednostce pracuje?"
    entities: {imie: "Beata", nazwisko: "Banaszak"}
    expected_data: {position: "Specjalista ds. dydaktyki", department: "Dziekanat Wydziału Informatyki i Telekomunikacji", user_type: "employee_administrative"}
    expected_answer: "Specjalista ds. dydaktyki, Dziekanat Wydziału Informatyki i Telekomunikacji."
    source: *informator
    expected_calls:
      - tool: get_staff
        args: {last_name: "Banaszak", first_name: "Beata"}

  - id: staff-edge-nieistniejacy
    question: "Na jakim stanowisku pracuje prof. Zenobiusz Nieistniejący z WIiT?"
    entities: {nazwisko: "Nieistniejący"}
    expected_data: null
    expected_answer: "Nie wiem — nie ma takiej osoby w bazie danych WIiT."
    edge_case: "nieistniejąca osoba — bot nie może zmyślić stanowiska/jednostki"
    source: *informator
    expected_calls:
      - tool: get_staff
        args: {last_name: "Nieistniejący"}

# ---------------------------------------------------------------------------
# Category 5 — konsultacje (office hours)
# ---------------------------------------------------------------------------
konsultacje:
  - id: konsultacje-andrzejewski
    question: "O której i gdzie ma konsultacje dr inż. Witold Andrzejewski?"
    entities: {imie: "Witold", nazwisko: "Andrzejewski"}
    expected_data: {day_of_week: "poniedziałek", start_time: "09:45", end_time: "13:15", location: "A23 CW17", comment: "najlepiej po umówieniu mailowym"}
    expected_answer: "Poniedziałek 09:45–13:15, sala A23 CW17 (komentarz: najlepiej po umówieniu mailowym)."
    source: *informator
    expected_calls:
      - tool: get_staff
        args: {last_name: "Andrzejewski", first_name: "Witold"}
      - tool: get_office_hour
        args: {staff_id: "$prev.id"}

  - id: konsultacje-wojciechowski-marek-wtorek
    question: "Czy dr hab. inż. Marek Wojciechowski (Zakład Technologii Przetwarzania Danych) ma konsultacje we wtorek, i o której?"
    entities: {imie: "Marek", nazwisko: "Wojciechowski", jednostka: "Zakład Technologii Przetwarzania Danych"}
    expected_data: {day_of_week: "wtorek", start_time: "12:30", end_time: "14:00", location: "A1 503"}
    expected_answer: "Tak, wtorek 12:30–14:00, sala A1 503 (prośba o wcześniejszy kontakt mailowy w celu potwierdzenia terminu; możliwe też spotkanie online)."
    notes: "Celowo zamknięte: listy 'kto z zakładu ma konsultacje' nie da się potwierdzić z próbki ~25/271 osób."
    source: *informator
    expected_calls:
      - tool: get_staff
        args: {last_name: "Wojciechowski", first_name: "Marek"}
      - tool: get_office_hour
        args: {staff_id: "$prev.id"}

  - id: konsultacje-edge-brak-opublikowanych
    question: "O której konsultacje ma prof. dr hab. inż. Hanna Bogucka?"
    entities: {imie: "Hanna", nazwisko: "Bogucka"}
    expected_data: {meetings: []}
    expected_answer: "Ta osoba obecnie nie ma opublikowanego harmonogramu konsultacji w Informatorze."
    edge_case: "osoba istnieje w bazie, ale bez zapisanych office_hours — to NIE to samo co 'osoba nie istnieje', bot nie powinien tych dwóch przypadków mylić"
    source: *informator
    # expected_calls note: The call must happen and come back empty — that is the only way to tell "no published hours" from "no such person".
    expected_calls:
      - tool: get_staff
        args: {last_name: "Bogucka", first_name: "Hanna"}
      - tool: get_office_hour
        args: {staff_id: "$prev.id"}

  - id: konsultacje-edge-niejednoznaczne-imie-i-nazwisko
    question: "Kiedy konsultacje ma dr Paweł Wojciechowski?"
    entities: {imie: "Paweł", nazwisko: "Wojciechowski"}
    expected_data: null
    expected_answer: null
    expected_behavior: >
      Bot NIE zgaduje i NIE wybiera pierwszego wyniku — na WIiT są dwie różne
      osoby o identycznym imieniu i nazwisku: dr hab. inż. Paweł Wojciechowski
      (Zakład Systemów Informatycznych, profesor uczelni) i dr inż. Paweł
      Wojciechowski (Zakład Teorii Algorytmów i Systemów Programowania,
      adiunkt). Musi dopytać o jednostkę/tytuł, zanim poda godziny.
    edge_case: "realna niejednoznaczność w danych WIiT — to samo imię I nazwisko, nie tylko nazwisko "
    source: *informator
    # expected_calls note: Stops at get_staff on purpose — calling get_office_hour means picking one of two people, which scores as extra_calls.
    expected_calls:
      - tool: get_staff
        args: {last_name: "Wojciechowski", first_name: "Paweł"}

  - id: konsultacje-edge-nieistniejaca-osoba
    question: "Kiedy konsultacje ma prof. Zenobiusz Nieistniejący z WIiT?"
    entities: {nazwisko: "Nieistniejący"}
    expected_data: null
    expected_answer: "Nie wiem — nie ma takiej osoby w bazie danych WIiT."
    edge_case: "nieistniejąca osoba — bot nie może zmyślić grafiku"
    source: *informator
    expected_calls:
      - tool: get_staff
        args: {last_name: "Nieistniejący"}

# ---------------------------------------------------------------------------
# Category 6 — poza_zakresem (questions no tool can answer)
#
# `expected_calls: []` is what exercises the called_no_tools axis; these cases are its
# core, and a few more live in other categories. Each baits a different tool, and
# none carries a `source`: the right refusal follows from the system's own scope,
# not from a document. Keep this category off the major axis — get_major is how the
# agent checks which majors exist, and prog-edge-kierunek-poza-zakresem expects that
# call. get_faculties is not a scope check either: it answers questions about
# the faculties themselves (category wydzialy), not whether a topic is covered.
# ---------------------------------------------------------------------------
poza_zakresem:
  - id: poza-zakresem-zapisy-na-obieralne
    question: "Jak zapisać się na przedmiot obieralny w systemie uczelni i do kiedy trwają zapisy?"
    expected_data: null
    expected_answer: "Nie obsługuję tego — zapisy na przedmioty i terminy zapisów są poza zakresem bota (progi punktowe, plany studiów, kadra i jednostki, konsultacje). Żadnej procedury ani żadnej daty podawać nie wolno."
    edge_case: "pytanie, na które nie odpowiada ŻADNE narzędzie — poprawna reakcja to odmowa BEZ odpytywania bazy"
    notes: "Przynęta: fraza 'przedmiot obieralny' pasuje do get_course, ale żadne narzędzie nie zna procedury ani terminów zapisów."
    # expected_calls note: Empty and strict — SYSTEM_PROMPT's "Sprawdzaj, zanim zaprzeczysz" exempts this class of question from checking.
    expected_calls: []

  - id: poza-zakresem-regulamin-warunkowy-wpis
    question: "Ile dni mam na złożenie podania o warunkowy wpis na kolejny semestr i ile razy można powtarzać ten sam przedmiot?"
    expected_data: null
    expected_answer: "Nie obsługuję tego — regulamin studiów (terminy podań, zasady warunkowego wpisu i powtarzania przedmiotów) jest poza zakresem bota. Żadnej liczby dni ani liczby powtórzeń podawać nie wolno."
    edge_case: "regulamin studiów — pytanie wprost o LICZBY, których nie zna żadne narzędzie"
    notes: "Pytanie prosi o dwie liczby, których baza nie ma — tu nie kusi żadne narzędzie, tylko wiedza pretrenowana."
    expected_calls: []

  - id: poza-zakresem-logowanie-reset-hasla
    question: "Nie mogę zalogować się do systemu eStudent — gdzie zgłosić reset hasła i pod jaki numer zadzwonić?"
    expected_data: null
    expected_answer: "Nie obsługuję tego — logowanie do systemów uczelni i zgłoszenia informatyczne są poza zakresem bota. Żadnego numeru telefonu ani adresu podawać nie wolno."
    edge_case: "logowanie do systemów uczelni + prośba o numer telefonu, który bot MOŻE pobrać z bazy, ale nie dla tej sprawy"
    notes: "Najgroźniejsza przynęta: departments ma telefony jednostek, więc get_department zwróci prawdziwy numer — tylko nie do tej sprawy. Faithfulness tego nie złapie (numer JEST w danych), łapie called_no_tools/extra_calls."
    expected_calls: []

# ---------------------------------------------------------------------------
# Category 7 — pytania_po_angielsku (English questions)
#
# Polish is the norm for this bot and for its sources, so the rest of this file
# stays Polish on purpose: an eval translated wholesale would measure a system
# nobody deploys. These cases exist because run_ingestion.py carries
# WIIT_MAJORS_EN_FIRST_CYCLE — students on an English-taught major really will
# ask in English, and nothing else here measures that.
#
# Two things are under test at once: the usual lookup, and the rule that the
# answer mirrors the question's language while values quoted from the database
# stay as stored.
# ---------------------------------------------------------------------------
pytania_po_angielsku:
  - id: en-kierunki-anglojezyczne
    question: "Which majors at WIiT are taught in English?"
    expected_data: {name: "Sztuczna inteligencja", is_english: true}
    expected_answer: "Sztuczna inteligencja — the only major with is_english=true. Answer in English, keeping the Polish name as stored."
    notes: "Baza NIE zna nazwy 'Artificial Intelligence' — w majors jest tylko nazwa polska (run_ingestion.py:74), wiec poprawna odpowiedz nie moze jej podac."
    source: *kierunki
    expected_calls:
      - tool: get_major
        args: {}

  - id: en-przedmiot-ects-po-angielsku
    question: "How many ECTS is 'Wprowadzenie do programowania' on Cyberbezpieczenstwo, and does it end with an exam?"
    expected_data: {semester: 1, ects: 5, is_obligatory: true, hours_lecture: 30, hours_lab: 30, assessment_type: "Egzamin"}
    expected_answer: "5 ECTS, ends with an exam. English answer; the course name and the assessment_type value stay Polish."
    notes: "Te same dane co przedmiot-wdp-cyberbezpieczenstwo-egzamin, inna mierzona rzecz: jezyk odpowiedzi. Nazwa kierunku bez polskich znakow, bo tak realnie pisza uzytkownicy."
    source: *przedmioty_cyber
    expected_calls:
      - tool: get_course
        args: {major_name: "Cyberbezpieczeństwo", course_name: "Wprowadzenie do programowania"}

  - id: en-konsultacje-po-angielsku
    question: "When and where does dr inz. Witold Andrzejewski hold his office hours?"
    expected_data: {day_of_week: "poniedziałek", start_time: "09:45", end_time: "13:15", location: "A23 CW17", comment: "najlepiej po umówieniu mailowym"}
    expected_answer: "Monday 09:45-13:15, room A23 CW17, with the published note 'najlepiej po umówieniu mailowym'. English answer; the weekday may be rendered as Monday, the room code and the comment stay as stored."
    source: *informator
    expected_calls:
      - tool: get_staff
        args: {last_name: "Andrzejewski", first_name: "Witold"}
      - tool: get_office_hour
        args: {staff_id: "$prev.id"}

  - id: en-edge-angielska-nazwa-kierunku
    question: "What are the first-semester courses on Artificial Intelligence?"
    expected_data: null
    expected_answer: null
    expected_behavior: >
      The agent must NOT conclude the major does not exist. No row is stored
      under "Artificial Intelligence": run_ingestion.py upserts the Polish name
      and uses the English one only to build the ECTS catalog URL, and
      get_course joins on LOWER(m.name). The honest route is to try, get
      nothing, enumerate with get_major(), match the user's English wording to
      the stored major, and retry with that name — or ask the user if it cannot
      be matched with confidence. Answer in English.
    edge_case: "kierunek istnieje, ale pod inna nazwa niz podana przez uzytkownika — angielskiej nazwy nie ma w bazie"
    notes: >
      Luka jest w danych: angielskiej nazwy nie ma w majors, wiec jedynym
      mostem miedzy pytaniem a baza jest lista z get_major() plus wnioskowanie
      modelu. Zmierzone 2026-10-01: agent przechodzi ten przypadek — pomija
      skazana na pustke probe z angielska nazwa i od razu enumeruje, wiec
      wywolanie get_course("Artificial Intelligence") jest dozwolone, ale nie
      wymagane. Naprawa po stronie danych (trzymac angielska nazwe i dopuscic
      ja w get_major/get_course) usunelaby to zgadywanie. Mapowania nazw
      celowo NIE ma w SYSTEM_PROMPT — prompt z odpowiedzia uniewaznia pomiar.
    expected_calls:
      - tool: get_major
        args: {}
      - tool: get_course
        args: {major_name: "Sztuczna inteligencja", semester: 1}

  - id: en-poza-zakresem-erasmus
    question: "I am an Erasmus student — how do I register for the semester and get my learning agreement signed?"
    expected_data: null
    expected_answer: "Refusal in English: the bot covers admission thresholds, study plans, staff and units, and office hours at WIiT — not enrolment or Erasmus paperwork. No procedure, no office, no date."
    edge_case: "pytanie poza zakresem zadane po angielsku — odmowa BEZ odpytywania bazy, w jezyku pytania"
    notes: "Mierzy dwie rzeczy naraz: called_no_tools oraz to, ze odmowa trafia w jezyk pytania. Tresc rozna od przykladu P5 w SYSTEM_PROMPT (tam: stypendium socjalne)."
    expected_calls: []

# ---------------------------------------------------------------------------
# Category 8 — powitanie_i_zakres (questions about the bot itself)
#
# Not an out-of-scope question — the bot answers this one. It is the only case
# about WIiTek rather than about WIiT, so nothing in the database can answer it
# and the correct reaction is a short self-introduction with no tool call
# (SYSTEM_PROMPT, example P8). The bait is get_faculties: its docstring used to
# tell the agent to check the system's scope before answering, which produced a
# stray call on en-poza-zakresem-erasmus. The docstring now rules that out; this
# case and that one show whether the reflex is gone.
#
# case_kind() reports this as "refusal" because it has no expected_data — the
# label is cosmetic, the scoring is called_no_tools plus both judges.
# ---------------------------------------------------------------------------
powitanie_i_zakres:
  - id: powitanie-kim-jestes
    question: "Cześć, co potrafisz?"
    expected_data: null
    expected_answer: "Przedstawia się jako WIiTek i w jednym krótkim akapicie podaje zakres: progi punktowe, plany studiów (przedmioty i ECTS), kadra i jednostki, konsultacje. Bez sekcji źródła, bez rozpisanej listy funkcji, bez zmyślonych możliwości (np. planu zajęć czy stypendiów)."
    edge_case: "pytanie o samego bota — jedyny przypadek, w którym poprawna odpowiedź nie pochodzi z bazy"
    notes: "Mierzy reguly tonu z SYSTEM_PROMPT (P8): autoprezentacja, zwiezlosc, zero wywolan. Zmyslenie zakresu jest tu realnym ryzykiem — obietnica planu zajec to dla uzytkownika gorsze niz odmowa."
    expected_calls: []

# ---------------------------------------------------------------------------
# Category 9 — wydzialy (faculties)
#
# The only cases where get_faculties is the right call. They pair with the
# no-tool cases above: get_faculties' docstring was narrowed so it stops being
# called as a scope check, and these show the narrowing did not also stop it
# being called when the question really is about the faculties.
# ---------------------------------------------------------------------------
wydzialy:
  - id: wydzial-pelna-nazwa-wiit
    question: "Jak brzmi pełna nazwa wydziału WIiT?"
    entities: {wydzial: "WIiT"}
    expected_data: {symbol: "WIiT", name: "Wydział Informatyki i Telekomunikacji"}
    expected_answer: "Wydział Informatyki i Telekomunikacji."
    notes: "Pokusa: model zna te nazwe z pretreningu i moze odpowiedziec bez wywolania — trafna odpowiedz bez zapytania to wciaz blad trasy."
    source: *informator
    expected_calls:
      - tool: get_faculties
        args: {}

  - id: wydzial-lista-obslugiwanych
    question: "Dla jakich wydziałów masz dane?"
    expected_data:
      faculties: [{symbol: "WIiT", name: "Wydział Informatyki i Telekomunikacji"}]
    expected_answer: "Tylko dla jednego: WIiT — Wydział Informatyki i Telekomunikacji."
    edge_case: "pytanie o zakres bota zadane wprost o wydzialy — w odróżnieniu od powitanie-kim-jestes tu odpowiedz pochodzi z bazy"
    notes: "Odpowiedz nie moze dopisac innych wydzialow PP, ktore model zna z pretreningu."
    source: *informator
    expected_calls:
      - tool: get_faculties
        args: {}
